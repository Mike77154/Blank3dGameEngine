; Katana test object. This is NOT a GWeapon89 firearm entry.
; K starts the clip. F3 shows/hides physical collision volumes.

[object]
enabled=true
preset=0
debug_draw=true

[visual]
; Exaggerated diagnostic scale: X=thickness, Y=blade width/curve, Z=length.
mesh_scale_thickness_percent=220
mesh_scale_width_percent=180
mesh_scale_length_percent=180

[mount]
; The whole Mecanim pivot lives in front of the player. Positive forward
; values are converted to player-local -Z by the runner.
mount_lateral_cm=0
mount_height_cm=105
mount_forward_cm=190

[mecanim]
tick_ms=16
duration_frames=28

; Frame-based collision window [start, end). The end frame is exclusive.
active_start_frame=7
active_end_frame=14

; Optional millisecond form. A non-zero value overrides the matching frame.
active_start_ms=0
active_end_ms=0

slash_start_yaw_deg=-78
slash_contact_yaw_deg=20
slash_end_yaw_deg=112
slash_pitch_deg=-18
slash_roll_deg=-8

[physical_damage]
damage=34
stun_frames=18
hitstop_frames=4
one_hit_per_enemy=true
blade_base_cm=7
blade_tip_cm=126
; True PDC3D oriented-box primitive, following the katana local axes.
damage_box_half_width_cm=15
damage_box_half_thickness_cm=10

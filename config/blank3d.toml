[audio]
enabled = true

[text]
# Vendored Monika FontCore provider. Keep blank to use the built-in 5x7
# emergency/debug fallback. Project fonts are caller-owned assets; no system
# font is bundled into Blank3D.
enabled = true
font = ""
pixel_size = 7

[camera]
profile_dir = "config/cameras"
start_profile = "tps_centred"
lock_mouse = true
zoom_fov = 45.0
sniper_zoom_fov = 18.0
zoom_speed = 120.0
# Logical camera view size; independent from render resolution/window size.
camerasizedraw = "960x540"

[scene]
# Logical room/scene screen-space size (GameMaker room-size analogue).
scenescreensize = "1920x1080"

[weapon]
initial = 1
gatling_spinup_ms = 360
slingshot_charge_ms = 900

[inventory]
ammo_9mm = 180
ammo_shells = 40
ammo_magnum = 24
ammo_sniper = 30
ammo_grenades = 18
ammo_rockets = 8
ammo_gatling = 900
ammo_stones = 60
ammo_hand_grenades = 6
ammo_shango_cells = 6
ammo_homing_rockets = 6
ammo_fuel = 360

[numeric]
damage_multiplier = 1.0
speed_multiplier = 1.0
recoil_multiplier = 1.0

[gravity]
enabled = true
fall_speed = 9.0
jump_acceleration = 22.0

[flags]
weapon_enabled = true
can_fire = true
can_reload = true
active_reload = true

[skybox]
# Keep global config clean: select a named INI recipe only.
enabled = false
catalog = "config/skybox/catalog.ini"
recipe = "procedural_default"


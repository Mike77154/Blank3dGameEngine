; Master recipe: this file chooses pieces. It does not draw anything itself.
[recipe]
include=../providers/plug_and_play.ini
include=../components/sniper_mask.ini
include=../components/sniper_telemetry.ini
select=scope
select=zoom
select=sway
select=animation

[hud]
overlay_id=3
hud_id=3

[scope]
catalog=../catalogs/scopes.ini
use=classic

[zoom]
catalog=../catalogs/zoom.ini
use=sniper8x

[sway]
catalog=../catalogs/sway.ini
use=sniper_default

[animation]
catalog=../catalogs/animations.ini
use=reticle_default

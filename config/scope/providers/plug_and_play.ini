; Provider routes for a plug-and-play build.
; auto:<name> means: try the named provider if the host registered it;
; otherwise use the library's built-in implementation.
[providers]
recipe=auto:host
preset=auto:host
vector=auto:host
primitive=auto:host
raster=auto:host
bars=auto:host
paint=auto:host
hud=auto:host
telemetry=auto:host
asset=auto:host
zoom=auto:host
animation=auto:host

; Tiny loop expressed as two alternating linear legs, no trig required.
[animation.breath_right]
trigger=always
mode=loop
duration_ms=1800

[channel.breath_x_out]
clip=breath_right
target=root
property=offset_x
from=-12
to=12
start_ms=0
duration_ms=900
ease=in_out_quad
blend=replace

[channel.breath_x_back]
clip=breath_right
target=root
property=offset_x
from=12
to=-12
start_ms=900
duration_ms=900
ease=in_out_quad
blend=replace

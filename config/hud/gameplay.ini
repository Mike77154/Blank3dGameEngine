; NumBar gameplay orchestrator.
; GFO: draw_numbar("config/hud/gameplay.ini")
; This file places and binds reusable visual presets.

[orchestrator]
enabled=true

[numbar player_health]
preset=presets/re5_radial_green_3d.bhud
space=screen
anchor=top_right
x=46
y=24
scale=100
z=20
bind.value=player.health
bind.min=zero
bind.max=player.health_max
bind.overlay=gameplay.threat
bind.overlay_min=zero
bind.overlay_max=100
visible_when=player.alive

[numbar player_health_vertical]
preset=presets/megaman_vertical_yellow.bhud
space=screen
anchor=top_right
x=18
y=22
scale=100
z=21
bind.value=player.health
bind.min=zero
bind.max=player.health_max
visible_when=player.alive

[numbar player_ammo]
preset=presets/ammo_cartridges_gold.bhud
space=screen
anchor=bottom_right
x=28
y=16
scale=100
z=30
bind.value=weapon.loaded
bind.min=zero
bind.max=weapon.capacity
bind.segments=weapon.capacity
bind.units=weapon.capacity
bind.value2=weapon.reserve
visible_when=player.alive

; NumBar gameplay orchestrator.
; GFO: draw_numbar("config/hud/gameplay.ini")
; This file places and binds reusable visual presets.

[orchestrator]
enabled=true

[numbar player_health]
preset=presets/re5_radial_green_3d.bhud
space=screen
anchor=top_right
x=46
y=24
scale=100
z=20
bind.value=player.health
bind.min=zero
bind.max=player.health_max
; Player health bars are health telemetry only. Threat remains available to
; dedicated threat/ECG widgets, but must not modulate the health bar.
visible_when=player.alive

[numbar player_health_vertical]
preset=presets/megaman_vertical_yellow.bhud
space=screen
anchor=top_right
x=18
y=22
scale=100
z=21
bind.value=player.health
bind.min=zero
bind.max=player.health_max
visible_when=player.alive

[numbar player_ammo]
preset=presets/ammo_cartridges_gold.bhud
space=screen
anchor=bottom_right
x=28
y=16
scale=100
z=30
bind.value=weapon.loaded
bind.min=zero
bind.max=weapon.capacity
bind.segments=weapon.capacity
bind.units=weapon.capacity
bind.value2=weapon.reserve
bind.layer_count=weapon.reload.active
bind.phase=weapon.reload.elapsed_ms
bind.overlay=weapon.active_reload.window_start_ms
bind.layer_size=weapon.active_reload.result
bind.overlay_max=weapon.reload.duration_ms
bind.mid=weapon.active_reload.window_end_ms
visible_when=player.alive

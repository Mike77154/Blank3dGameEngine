# Blank3D Shango-inspired orbital targeting weapon.
# Original geometry/effect recipe; no game asset is copied.
[weapon]
id=12
name=shango_weapon
gun_id=12
ammo_id=11
projectile_id=12
shell_id=0
muzzle_id=0
casing_id=0
trail_id=12
projectile_mesh_id=11
shell_mesh_id=0
gun_name=shango_weapon
ammo_name=shango_cells
projectile_name=orbital_press_payload
shell_name=none
muzzle_name=none
casing_name=none
trail_name=shango_ion
projectile_mesh_name=shango_energy_cylinder
shell_mesh_name=none
fire_mode=semi
clip_size=1
ammo_per_shot=1
pellet_count=1
burst_count=1
allow_dry_fire=1
active_reload=0
cooldown_ms=1800
reload_ms=2100
projectile_life_ms=1800
damage=240.0
projectile_speed=14.5
range=180.0
spread=0
projectile_radius=1.10
projectile_mesh_scale=1.0
shell_mesh_scale=0
recoil=0.15

[modules]
# Target acquisition and orbital spawn.
trigger=charge_release
physics=linear
trail=heavy
optic=generic
sway=0
aim_query=1
emit_muzzle=0
emit_casing=0
emit_trail=1
projectile_mesh_id=11
casing_mesh_id=0
scope_preset=none
crosshair_preset=target_lock
charge_time_ms=900
charge_min_speed=14.5
charge_max_speed=14.5
gravity=0
bounce=0
drag=0
mass=4

# Spawn twelve units above the selected hostile target.
satellaborner=1
satellaborner_offset_x=0
satellaborner_offset_y=12
satellaborner_offset_z=0

# Keep steering at the same target while the column collapses onto it.
telesearcher=1
telesearcher_reacquire=0
telesearcher_gain=1.0
telesearcher_offset_x=0
telesearcher_offset_y=0.85
telesearcher_offset_z=0

# Data-driven visual recipe: a luminous column blooms, then flattens.
projectile_visual=shango_press
projectile_visual_expand_ms=180
projectile_visual_crush_ms=520
projectile_visual_radial_start=0.30
projectile_visual_radial_peak=2.35
projectile_visual_radial_end=1.05
projectile_visual_axial_start=6.50
projectile_visual_axial_end=0.28
projectile_visual_unlit=1
projectile_visual_additive=1

[audio]
enabled=1
profile=launcher
action=rifle
magazine=none
ammo=none
muzzle=bare
shell=none
detachable_magazine=0
emits_casing=0
projectile=tracer
explosion=none
continuous_rocket=0
pressure_energy_q15=32000
projectile_gain_q15=24500
projectile_proximity_q15=32000
projectile_instance_limit=4
explosion_gain_q15=32000
fire_gain_q15=30000
action_speed=0.55

[presentation]
# L.T.D.-like chunky targeting chassis made from the existing procedural
# mechanical weapon parts. model_id is data identity; no Capcom model is used.
model=shango_targeter_model
model_id=12
socket=weapon_r
attachment=equipped_weapon
mechanism=fixed
detachable_magazine=0
fire_ticks=16
grip_x=0
grip_y=0
grip_z=0
scale_x=1.25
scale_y=0.85
scale_z=1.45
recoil_z=0.03
recoil_pitch=-1
action_home_z=0
action_fire_z=0
feed_home_y=0
feed_home_z=0
feed_out_y=0
feed_out_z=0
barrel_home_z=-0.50
muzzle_y=0.06
muzzle_z=-1.30

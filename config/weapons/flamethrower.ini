# Blank3D ID 14 Flamethrower.
# expandiblefire89 keeps the physical expanding boxes as collision truth.
# The host now skins those boxes with the FireLoop1 128x128/50-frame atlas as
# camera-facing additive billboards; the boxes themselves stay mechanically
# authoritative and become invisible whenever the atlas is available.

[weapon]
id=14
name=flamethrower
gun_id=14
ammo_id=13
projectile_id=14
shell_id=0
muzzle_id=2
casing_id=0
trail_id=0
projectile_mesh_id=13
shell_mesh_id=0
gun_name=flamethrower
ammo_name=fuel
projectile_name=flame_cube
shell_name=none
muzzle_name=flame_igniter
casing_name=none
trail_name=none
projectile_mesh_name=giffany_shapes3d:expandible_fire_cube
shell_mesh_name=none
fire_mode=auto
clip_size=120
ammo_per_shot=1
pellet_count=1
burst_count=1
allow_dry_fire=1
active_reload=1
cooldown_ms=45
reload_ms=2500
projectile_life_ms=1200
active_reload_window_start_ms=450
active_reload_window_end_ms=850
active_reload_bonus_ms=220
active_reload_penalty_ms=300
damage=4.0
projectile_speed=8.5
range=7.0
spread=5.5
projectile_radius=0.20
projectile_mesh_scale=0.42
shell_mesh_scale=0
recoil=0.10

[modules]
trigger=standard
physics=linear
trail=none
optic=none
sway=0
aim_query=0
emit_muzzle=1
emit_casing=0
emit_trail=0
projectile_mesh_id=13
casing_mesh_id=0
scope_preset=none
crosshair_preset=shotgun_dynamic
charge_time_ms=0
charge_min_speed=0
charge_max_speed=0
gravity=0
bounce=0
drag=0
mass=0.2

# Flamethrower puffs are ordinary muzzle projectiles, not orbital/homing shots.
satellaborner=0
telesearcher=0

# Generic vendored projectile behaviour.  The cube begins tiny, grows while it
# actually travels through the world, reaches full size near the end of the
# cone, and is killed by distance even if its lifetime still has time left.
expandible_fire=1
expandible_fire_scale_start=0.25
expandible_fire_scale_end=2.40
expandible_fire_growth_distance=5.20
expandible_fire_kill_distance=6.25
expandible_fire_collision_growth=1

# Presentation is separate from behaviour. expandible_fire selects the host
# flamethrower skin: animated billboard + hot core + glow + stream light.
# If the atlas cannot load, Blank3D falls back to the old procedural cube.
projectile_visual=expandible_fire
projectile_visual_unlit=1
projectile_visual_additive=1

# Sprite-source mode. The current FireLoop is a TileCell89 atlas/grid, while
# the same billboard consumer can also use static/sequence/renlist/gmstrip.
projectile_sprite_mode=tilecell
projectile_visual_billboard=1
projectile_visual_loop=forward

# Generic projectile billboard recipe. The image request is a logical
# AssetRoute89 name discovered under config/weapons/assets; no C source knows
# this filename or this atlas layout. Replace these values to swap effects.
projectile_visual_image=flamethrower_fireloop_128_50_atlas
projectile_visual_frame_width=128
projectile_visual_frame_height=128
projectile_visual_columns=8
projectile_visual_rows=7
projectile_visual_frame_count=50
projectile_visual_frame_ms=33
projectile_visual_phase_step=7
projectile_visual_width_scale=1.55
projectile_visual_height_scale=2.10
projectile_visual_glow=1
projectile_visual_glow_scale=1.30
projectile_visual_glow_alpha=105
projectile_visual_core=1
projectile_visual_core_scale=0.72
projectile_visual_core_alpha=150
projectile_visual_light=1
projectile_visual_light_intensity=1.20
projectile_visual_light_radius=4.00
projectile_visual_light_r=255
projectile_visual_light_g=112
projectile_visual_light_b=32

[audio]
# No fake machine-gun Foley. A dedicated flame-loop synth can be attached later
# without changing projectile mechanics.
enabled=0
profile=none
action=none
magazine=none
ammo=none
muzzle=bare
shell=none
detachable_magazine=0
emits_casing=0
projectile=none
explosion=none
continuous_rocket=0
fire_gain_q15=0

[presentation]
# Temporary low-poly host chassis. Mechanics are fully data-driven and do not
# depend on this model identity.
model=machine_gun_model
model_id=2
socket=weapon_r
attachment=equipped_weapon
mechanism=fixed
detachable_magazine=0
fire_ticks=4
grip_x=0
grip_y=0
grip_z=0
scale_x=1.10
scale_y=1.08
scale_z=1.35
recoil_z=0.01
recoil_pitch=0
action_home_z=0
action_fire_z=0
feed_home_y=-0.3125
feed_home_z=0.15
feed_out_y=-0.85
feed_out_z=0.25
barrel_home_z=-0.62
muzzle_y=0.02
muzzle_z=-1.35

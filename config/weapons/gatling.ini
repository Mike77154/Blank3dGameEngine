# Blank3D weapon definition. Edit and restart/reload the engine.
[weapon]
id=8
name=gatling_gun
gun_id=8
ammo_id=7
projectile_id=2
shell_id=2
muzzle_id=8
casing_id=8
trail_id=8
projectile_mesh_id=2
shell_mesh_id=2
gun_name=gatling_gun
ammo_name=gatling_gun
projectile_name=machinegun_projectile
shell_name=machinegun_shell
muzzle_name=gatling
casing_name=gatling
trail_name=gatling_tracer
projectile_mesh_name=machinegun_projectile
shell_mesh_name=machinegun_shell
fire_mode=auto
clip_size=300
ammo_per_shot=1
pellet_count=1
burst_count=3
allow_dry_fire=1
active_reload=1
fire_rate_bps=28.571
reload_ms=3200
projectile_life_ms=2600
active_reload_window_start_ms=250
active_reload_window_end_ms=520
active_reload_bonus_ms=180
active_reload_penalty_ms=220
damage=6.5
projectile_speed=62.0
range=125.0
spread=1.15
projectile_radius=0.10
projectile_mesh_scale=0.44
shell_mesh_scale=0.26
recoil=0.48

[modules]
trigger=spinup
physics=linear
trail=tracer
optic=none
sway=0
aim_query=0
emit_muzzle=1
# Shared starburst muzzle placeholder. Lifetime stays below the ~35 ms shot
# interval so the high-rate weapon flickers instead of becoming a solid disk.
muzzle_image=config/weapons/assets/pistol_muzzle_flash.jpg
muzzle_image_width=0.92
muzzle_image_height=0.84
muzzle_image_ms=30
muzzle_image_billboard=view
muzzle_image_blend=additive
muzzle_image_glow=1
muzzle_image_glow_scale=1.40
muzzle_image_glow_alpha=112
muzzle_light=1
muzzle_light_ms=38
muzzle_light_intensity=2.35
muzzle_light_radius=7.5
muzzle_light_r=255
muzzle_light_g=212
muzzle_light_b=130
emit_casing=1
emit_trail=1
projectile_mesh_id=2
casing_mesh_id=2
scope_preset=none
crosshair_preset=spray_control
charge_time_ms=0
charge_min_speed=0
charge_max_speed=0
gravity=0
bounce=0
drag=0
mass=1

# Six physical muzzle points around the barrel cluster. The shot sequence is
# stateful per actor+weapon, and every displaced projectile converges back to
# the same authoritative aim point.
bullet_circle=1
bullet_circle_count=6
bullet_circle_radius=0.18
bullet_circle_phase=0.25
bullet_spin=1
bullet_spin_start=0
bullet_spin_step=1
bullet_spin_direction=clockwise
bullet_inline=1
bullet_inline_distance=125

[audio]
enabled=1
profile=heavy
action=machine
magazine=drum_heavy
ammo=belt_box
muzzle=compensator
shell=rifle_brass
detachable_magazine=1
emits_casing=1
projectile=tracer
explosion=none
continuous_rocket=0
pressure_energy_q15=28000
ammo_motion_q15=24500
magazine_velocity_q15=28500
magazine_gain_q15=22800
reload_remove_motion_q15=27000
reload_insert_motion_q15=30500
casing_velocity=260
casing_angular_velocity=240
casing_gain_q15=24800
projectile_gain_q15=22000
projectile_proximity_q15=30000
projectile_instance_limit=32
explosion_gain_q15=29200
rocket_whistle_gain_q15=10500
rocket_spin_gain_q15=5900
fire_gain_q15=23800
dry_receiver_impulse=3600
action_speed=1.5

[presentation]
# GWeapon selects the object/model and mechanism. GAttach mounts it on any actor;
# NationalMecanicanimal89 animates this profile without knowing the carrier type.
model=gatling_model
model_id=8
socket=weapon_r
attachment=equipped_weapon
mechanism=gatling_belt
detachable_magazine=0
fire_ticks=4
grip_x=0
grip_y=0
grip_z=0
scale_x=1
scale_y=1
scale_z=1
recoil_z=0.08
recoil_pitch=-2
action_home_z=0
action_fire_z=0
feed_home_y=-0.3125
feed_home_z=0.15
feed_out_y=-0.85
feed_out_z=0.25
barrel_home_z=-0.62
muzzle_y=0.01
muzzle_z=-1.54

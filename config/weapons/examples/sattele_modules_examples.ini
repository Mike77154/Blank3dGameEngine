# Snippets only. Copy these keys into a real weapon's [modules] section.

# 1) Spawn exactly at the selected hostile target.
[modules_satellite_exact]
satellaborner=1
satellaborner_offset_x=0
satellaborner_offset_y=0
satellaborner_offset_z=0
telesearcher=0

# 2) "Orbital strike" composition: payload is born 12 world units above
# the selected target, then homes toward the target every projectile tick.
[modules_orbital_seek]
satellaborner=1
satellaborner_offset_x=0
satellaborner_offset_y=12
satellaborner_offset_z=0
telesearcher=1
telesearcher_reacquire=0
telesearcher_gain=1.0
telesearcher_offset_x=0
telesearcher_offset_y=0.8
telesearcher_offset_z=0

# 3) Ordinary muzzle-spawned homing projectile.
[modules_homing_only]
satellaborner=0
telesearcher=1
telesearcher_reacquire=1
telesearcher_gain=0.35
telesearcher_offset_y=0.8

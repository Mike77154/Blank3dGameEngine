# Blank3D weapon definition. Edit and restart/reload the engine.
[weapon]
id=1
name=pistol
gun_id=1
ammo_id=1
projectile_id=1
shell_id=1
muzzle_id=1
casing_id=1
trail_id=1
projectile_mesh_id=1
shell_mesh_id=1
gun_name=pistol
ammo_name=pistol
projectile_name=pistol
shell_name=pistol
muzzle_name=pistol
casing_name=pistol
trail_name=bullet
projectile_mesh_name=pistol_projectile
shell_mesh_name=pistol_shell
fire_mode=semi
clip_size=15
ammo_per_shot=1
pellet_count=1
burst_count=3
allow_dry_fire=1
active_reload=1
cooldown_ms=160
reload_ms=700
projectile_life_ms=2600
active_reload_window_start_ms=250
active_reload_window_end_ms=520
active_reload_bonus_ms=180
active_reload_penalty_ms=220
damage=10.0
projectile_speed=34.0
range=72.0
spread=0.0
projectile_radius=0.12
projectile_mesh_scale=0.34
shell_mesh_scale=0.30
recoil=0.35

[modules]
trigger=standard
physics=linear
trail=bullet
optic=generic
sway=0
aim_query=0
emit_muzzle=1
# Uploaded source image, rendered directly by imgcc0 -> SpritePlane89.
# Additive blending makes the JPEG black background contribute zero light.
muzzle_image=config/weapons/assets/pistol_muzzle_flash.jpg
muzzle_image_width=1.10
muzzle_image_height=1.10
muzzle_image_ms=58
muzzle_image_billboard=view
muzzle_image_blend=additive
# Runtime bloom pass: same source image, no pre-baked halo.
muzzle_image_glow=1
muzzle_image_glow_scale=1.55
muzzle_image_glow_alpha=160
# Real illumination pulse. This is GL_LIGHT1 at the renderer boundary, while
# timing/intensity/radius stay fixed-point in the runtime.
muzzle_light=1
muzzle_light_ms=72
muzzle_light_intensity=3.25
muzzle_light_radius=9.0
muzzle_light_r=255
muzzle_light_g=205
muzzle_light_b=112
emit_casing=1
emit_trail=1
projectile_mesh_id=1
casing_mesh_id=1
scope_preset=none
crosshair_preset=pistol_crisp
crosshair_preset_first_person=blank3d_pistol_first_person
crosshair_preset_third_person=blank3d_pistol_third_person
charge_time_ms=0
charge_min_speed=0
charge_max_speed=0
gravity=0
bounce=0
drag=0
mass=1

[audio]
enabled=1
profile=smg
action=pistol
magazine=pistol_polymer
ammo=box_mag
muzzle=bare
shell=pistol_brass
detachable_magazine=1
emits_casing=1
projectile=near_miss
explosion=none
continuous_rocket=0
pressure_energy_q15=18000
ammo_motion_q15=11800
magazine_velocity_q15=23500
magazine_gain_q15=24800
reload_remove_motion_q15=27000
reload_insert_motion_q15=30500
casing_velocity=150
casing_angular_velocity=180
casing_gain_q15=24500
projectile_gain_q15=21000
projectile_proximity_q15=23000
projectile_instance_limit=24
explosion_gain_q15=29200
rocket_whistle_gain_q15=10500
rocket_spin_gain_q15=5900
fire_gain_q15=25500
dry_receiver_impulse=4300
action_speed=1.2

[presentation]
# GWeapon selects the object/model and mechanism. GAttach mounts it on any actor;
# NationalMecanicanimal89 animates this profile without knowing the carrier type.
model=pistol_model
model_id=1
socket=weapon_r
attachment=equipped_weapon
mechanism=slide_magazine
detachable_magazine=1
fire_ticks=7
grip_x=0
grip_y=0
grip_z=0
scale_x=1
scale_y=1
scale_z=1
recoil_z=0.08
recoil_pitch=-2
action_home_z=-0.08
action_fire_z=0.14
feed_home_y=-0.3125
feed_home_z=0.15
feed_out_y=-0.85
feed_out_z=0.25
barrel_home_z=-0.62
muzzle_y=0.02
muzzle_z=-0.86

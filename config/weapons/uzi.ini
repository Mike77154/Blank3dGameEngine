# Pickup-only test SMG. It is catalogued globally but intentionally absent
# from player_weapons.ini, so the player must acquire it through PBB/CT89.
[weapon]
id=11
name=uzi
gun_id=11
ammo_id=10
projectile_id=2
shell_id=2
muzzle_id=11
casing_id=2
trail_id=11
projectile_mesh_id=2
shell_mesh_id=2
gun_name=uzi
ammo_name=uzi_9mm_ammo
projectile_name=machinegun_projectile

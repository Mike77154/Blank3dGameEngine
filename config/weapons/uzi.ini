muzzle_light_g=212
muzzle_light_b=130
emit_casing=1
emit_trail=1
projectile_mesh_id=2
casing_mesh_id=2
# Optional vendored projectile-origin/homing modules. Disabled for the Uzi;
# these lines deliberately exercise the data-driven parser without changing
# the pickup test weapon's normal behavior.
satellaborner=0
satellaborner_offset_x=0
satellaborner_offset_y=0
satellaborner_offset_z=0
telesearcher=0

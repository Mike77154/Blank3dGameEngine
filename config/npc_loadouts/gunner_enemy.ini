# Per-NPC inventory. Weapon names resolve against config/weapons/weapons.ini.
# Any new profile added to that global manifest can be used here by name.

[loadout]
equipped=machine_gun

[weapons]
pistol=1
machine_gun=1
shotgun=1

[ammo]
# Numeric ammo IDs remain valid, including IDs used by brand-new INI weapons.
ammo_1=600
ammo_2=60

[clips]
pistol=15
machine_gun=40
shotgun=7

; GeneralConfig.cfg
; Host/platform presentation config. This is intentionally NOT blank3d.toml.
; Window ownership and render/output policy are separate so ports can choose
; different native windows while keeping the same game/render intent.

[Window]
WindowSize = 960x540
PlayMode = windowed
Resizable = 1
Decorated = 1
Center = 1
AlwaysOnTop = 0
Visible = 1
Title = Blank3D
Monitor = 0

[Video]
; Internal render resolution. It does NOT automatically become window size.
Resolution = 960x540
; native | fit | stretch | integer | overscan | 2x..16x
ScreenScale = fit
KeepAspect = 1
CenterOutput = 1
; nearest preserves intentional low-resolution pixels; linear smooths scaling.
Filter = nearest
VSync = 1

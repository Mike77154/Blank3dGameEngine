; Blank3D compatibility animation profile.
; Neutral geometry remains the exact original four-line pistol crosshair.
; Timings are animation ticks; Blank3D advances them from real frame_ms at ~60 Hz.

[animation]
auto_input_events=1

[event.aim_enter]
enabled=1
scale_percent=94
alpha_percent=100
thickness_percent=100
dot_percent=100
attack_ticks=4
attack_curve=smoothstep
return_mode=none

[event.aim_exit]
enabled=1
scale_target=neutral
alpha_percent=100
thickness_percent=100
dot_percent=100
attack_ticks=4
attack_curve=smoothstep
return_mode=none

[event.fire]
enabled=1
scale_percent=132
rotation_deg=0
offset_x_px=0
offset_y_px=0
alpha_percent=100
thickness_percent=100
dot_percent=100
attack_ticks=2
hold_ticks=1
return_ticks=7
attack_curve=ease_out
return_curve=smoothstep
return_mode=start
repeat_count=1
retrigger=restart

[event.hit]
enabled=1
scale_percent=112
rotation_deg=0
alpha_percent=100
thickness_percent=115
dot_percent=100
attack_ticks=2
hold_ticks=1
return_ticks=6
attack_curve=ease_out
return_curve=ease_out
return_mode=start
repeat_count=1
retrigger=restart

[event.disabled]
enabled=1
scale_percent=92
alpha_percent=35
thickness_percent=100
dot_percent=100
attack_ticks=4
attack_curve=smoothstep
return_mode=none

[event.enabled]
enabled=1
scale_target=neutral
alpha_percent=100
thickness_percent=100
dot_percent=100
attack_ticks=4
attack_curve=smoothstep
return_mode=none

[event.custom1]
enabled=1
scale_percent=118
rotation_deg=2
alpha_percent=90
thickness_percent=110
dot_percent=100
attack_ticks=3
hold_ticks=2
return_ticks=7
attack_curve=smoothstep
return_curve=smoothstep
return_mode=start
repeat_count=2
retrigger=restart

[event.custom2]
enabled=1
scale_percent=96
rotation_deg=-2
offset_x_px=1
alpha_percent=100
thickness_percent=100
dot_percent=100
attack_ticks=3
hold_ticks=1
return_ticks=5
attack_curve=ease_out
return_curve=ease_out
return_mode=start
repeat_count=3
retrigger=restart

; Exact recipe form of the original Blank3D pistol crosshair in first person.
; Old HUD code: endpoints +/-13, inner gap +/-5, white, one GL line.

[include]
include_000=../parts/abi3_defaults.ini
include_010=../animations/blank3d_classic.ini

[preset]
id=192
name=blank3d_pistol_first_person
category=pistol

[style]
use_aim_variant=0
use_fire_variant=0
use_hit_variant=0
color_change_enabled=0
spread_multiplier_fx=0

[animation]
micro_scale_fx=65536
neutral_scale_fx=65536
maxi_scale_fx=65536
speed_fx_per_tick=0

[normal]
draw_mode=vector
arm_mask=15
dot_enabled=0
gap_px=5
arm_length_px=8
thickness_px=1
dot_size_px=1
image_id=0
image_width_px=0
image_height_px=0
color=0xFFFFFFFF
image_tint=0xFFFFFFFF
shape=cross
segment_mask=255
direction_mask=15
spread_mode=none
radius_x_px=0
radius_y_px=0
depth_px=0
rotation_deg=0
break_px=0

[aim]
inherit=normal

[fire]
inherit=normal

[hit]
inherit=normal

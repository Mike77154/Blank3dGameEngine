# Generic drivable vehicle recipe. Nothing here says "this belongs to Player".
[vehicle]
name=test_car
profile=warthog89
movement=car
playerdriving=1
npcdriving=1
driver_ddsl=scripts/vehicle_driver.ddsl2

[driving]
drive_speed=24
run_speed=30
mount_radius=4.0
# Throttle is ramped instead of snapping 0 -> 1 every frame.
throttle_rise=2.8
throttle_fall=4.5
# Blank3D +Z/-Z handedness needs the steering bridge inverted.
invert_steer=1
# Make the prototype visibly accelerate instead of crawling under stock mass.
torque_scale=8.0
reverse_scale=1.65
velocity_retention=0.985
mass_scale=0.75

[visual]
scale_x=1.0
scale_y=0.85
scale_z=1.0
visual_y_offset=-1.90

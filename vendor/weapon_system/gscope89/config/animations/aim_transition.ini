; Event-driven aim transition. Inactive clips evaluate to identity.
[animation.aim_enter]
trigger=aim_enter
mode=oneshot
duration_ms=120

[channel.aim_enter_scale]
clip=aim_enter
target=root
property=scale
from=1060
to=1000
start_ms=0
duration_ms=120
ease=out_quad
blend=replace

[channel.aim_enter_alpha]
clip=aim_enter
target=root
property=alpha
from=0
to=1000
start_ms=0
duration_ms=120
ease=out_quad
blend=replace

[animation.aim_exit]
trigger=aim_exit
mode=oneshot
duration_ms=100

[channel.aim_exit_scale]
clip=aim_exit
target=root
property=scale
from=1000
to=1040
start_ms=0
duration_ms=100
ease=in_quad
blend=replace

[channel.aim_exit_alpha]
clip=aim_exit
target=root
property=alpha
from=1000
to=0
start_ms=0
duration_ms=100
ease=in_quad
blend=replace

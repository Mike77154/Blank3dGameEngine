; Fire recoil: pop the complete reticle outward then settle back.
[animation.fire_kick]
trigger=fire
mode=oneshot
duration_ms=120

[channel.fire_expand]
clip=fire_kick
target=root
property=scale
from=1000
to=1140
start_ms=0
duration_ms=35
ease=out_quad
blend=replace

[channel.fire_return]
clip=fire_kick
target=root
property=scale
from=1140
to=1000
start_ms=35
duration_ms=85
ease=in_quad
blend=replace

; Example for an engine that wants to own rendering and camera integration.
; Domains marked external MUST be supplied by the registered provider.
[providers]
recipe=auto:engine
preset=auto:engine
vector=external:engine
primitive=auto:engine
raster=external:engine
bars=auto:engine
paint=external:engine
hud=auto:engine
telemetry=external:engine
asset=external:engine
zoom=external:engine
animation=external:engine

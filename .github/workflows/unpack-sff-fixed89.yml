name: Expand sff_fixed89 source bundle

on:
  push:
    branches:
      - agent/publish-sff-fixed89-cc0
    paths:
      - third_party/.sff_fixed89_import_ready

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-sff-fixed89-cc0
          fetch-depth: 0

      - name: Verify and expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat third_party/.sff_fixed89_parts/part-*.b64 | base64 --decode > /tmp/sff_fixed89.zip
          echo "3949ba009c662348f43411885bc60ac1df6ca7387c135b78f364b37ef9cf3aa2  /tmp/sff_fixed89.zip" | sha256sum -c -
          rm -rf /tmp/sff_fixed89_unpack third_party/sff_fixed89
          mkdir -p /tmp/sff_fixed89_unpack third_party/sff_fixed89
          unzip -q /tmp/sff_fixed89.zip -d /tmp/sff_fixed89_unpack
          test -d /tmp/sff_fixed89_unpack/sff_fixed
          cp -a /tmp/sff_fixed89_unpack/sff_fixed/. third_party/sff_fixed89/
          rm -rf third_party/.sff_fixed89_parts
          rm -f third_party/.sff_fixed89_import_ready
          rm -f .github/workflows/unpack-sff-fixed89.yml

      - name: Commit expanded source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish sff_fixed89 v0.1.0 under CC0-1.0"
          git push origin HEAD:agent/publish-sff-fixed89-cc0

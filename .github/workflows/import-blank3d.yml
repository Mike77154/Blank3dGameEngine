name: Import Blank3D source tree

on:
  push:
    branches:
      - Mike77154
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: Mike77154
          fetch-depth: 0

      - name: Validate and unpack archive into repository root
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import tempfile
          import zipfile

          repo = Path.cwd()
          archive = repo / "blank3d_giffany_motion89_combat_traversal_v3_25_4_automatic_fire_frame_lock.zip"
          if not archive.is_file():
              raise SystemExit(f"Archive not found: {archive}")

          with tempfile.TemporaryDirectory() as td:
              temp = Path(td)
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      member = PurePosixPath(info.filename)
                      if member.is_absolute() or ".." in member.parts:
                          raise SystemExit(f"Unsafe ZIP member: {info.filename}")
                  zf.extractall(temp)

              entries = list(temp.iterdir())
              source = entries[0] if len(entries) == 1 and entries[0].is_dir() else temp

              for item in source.iterdir():
                  destination = repo / item.name
                  if item.is_dir():
                      shutil.copytree(item, destination, dirs_exist_ok=True)
                  else:
                      shutil.copy2(item, destination)

          archive.unlink()
          workflow = repo / ".github/workflows/import-blank3d.yml"
          workflow.unlink(missing_ok=True)
          bootstrap = repo / ".bootstrap-init"
          bootstrap.unlink(missing_ok=True)
          PY

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Blank3D Game Engine v3.25.4 source tree"
          git push origin HEAD:Mike77154
